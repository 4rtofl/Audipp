name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.paths.outputs.android }}
      server: ${{ steps.paths.outputs.server }}
      audio: ${{ steps.paths.outputs.audio }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          android=false
          server=false
          audio=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/ci.yml)
                  android=true
                  server=true
                  audio=true
                  ;;
                gradlew|gradlew.bat|gradle/wrapper/*|gradle.properties)
                  android=true
                  server=true
                  ;;
                app/*|gradle/*|build.gradle.kts|settings.gradle.kts|settings-gradle.lockfile)
                  android=true
                  ;;
                server/*)
                  server=true
                  ;;
                scripts/audio/*|tests/audio/*)
                  audio=true
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          else
            android=true
            server=true
            audio=true
          fi
          {
            echo "android=$android"
            echo "server=$server"
            echo "audio=$audio"
          } >> "$GITHUB_OUTPUT"

  audio:
    name: Audio fixtures and evidence
    needs: changes
    if: needs.changes.outputs.audio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test audio fixtures, Float64 reference and evidence records
        run: |
          python3 -m unittest discover -s scripts/audio -p 'test_*.py'
          python3 -m scripts.audio.evidence tests/audio/result-template.json

  server:
    name: Server HTTPS, ownership and PostgreSQL contracts
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Server contracts and local distribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          lock_args=()
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE_SHA" HEAD -- 'server/*.gradle.kts' 'server/*.lockfile' 'gradle/wrapper/*')
            if [[ -n "$files" ]]; then
              lock_args+=(--write-locks)
            fi
          fi
          ./gradlew -p server --no-daemon --console=plain test installDist distTar "${lock_args[@]}"
          sha256sum server/build/distributions/audipp-server.tar > server/build/distributions/SHA256SUMS
          git diff --exit-code -- 'server/*.lockfile'
      - name: Upload server test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-verification-reports
          path: |
            server/build/reports/tests/
            server/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload local server distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-not-for-deployment
          path: server/build/distributions/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android build, unit tests, lint, release
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null'
      - name: Detect dependency changes
        id: dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE_SHA" HEAD -- '*.gradle.kts' 'gradle/*.toml' 'gradle/wrapper/*' '*.lockfile')
            if [[ -n "$files" ]]; then
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Debug and test APKs, unit tests, lint, unsigned Release build
        env:
          DEPENDENCIES_CHANGED: ${{ steps.dependencies.outputs.changed }}
        run: |
          lock_args=()
          if [[ "$DEPENDENCIES_CHANGED" == 'true' ]]; then
            lock_args+=(--write-locks)
          fi
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleRelease "${lock_args[@]}"
      - name: Verify committed dependency locks
        run: git diff --exit-code -- '*.lockfile'
      - name: Upload test and lint reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload CI APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-apks-not-for-distribution
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
